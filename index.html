main{max-width:640px;margin:0 auto;padding:16px 16px 40px}

.big{font-size:20px;font-weight:800;margin:6px 0}

/* Mobile and touch-device improvements */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 12px;
}
body {
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
main {
  width: 100%;
  min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input {
  touch-action: manipulation;
}
button {
  -webkit-appearance: none;
  appearance: none;
}
.opt > span:last-child,
.rev,
.q,
.sub,
.sum {
  overflow-wrap: anywhere;
}
.chip, .seg button, .opt, .btn, .ic, .link {
  -webkit-user-select: none;
  user-select: none;
}
@media (max-width: 480px) {
  main {
    padding-top: 12px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: clamp(21px, 6vw, 24px); }
  .q { font-size: clamp(18px, 5vw, 20px); }
  .chips, .seg { gap: 7px; }
  .chip, .seg button {
    padding: 9px 11px;
    min-height: 44px;
    max-width: 100%;
    white-space: normal;
    text-align: center;
  }
  .seg button { flex: 1 1 auto; }
  .row {
    align-items: center;
    gap: 10px;
  }
  .row > span:first-child { min-width: 0; }
  .opt {
    gap: 10px;
    padding: 12px 10px;
    min-height: 54px;
  }
  .bub { width: 30px; height: 30px; }
  .top {
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .top > span:first-child { flex: 1 1 auto; }
  .top .cmb { min-width: 0; }
  .score { font-size: clamp(44px, 14vw, 56px); }
  .pc { padding: 12px; }
  .bd { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .xpb { gap: 6px 12px; flex-wrap: wrap; }
  .toast { left: 10px; right: 10px; }
}
@media (max-width: 350px) {
  main { padding-left: 12px; padding-right: 12px; }
  .chip, .seg button { padding: 8px 9px; font-size: 14px; }
  .opt { font-size: 15px; }
  .b1 span { font-size: 21px; }
}
@media (hover: none) and (pointer: coarse) {
  .chip, .seg button { min-height: 44px; }
  .btn { min-height: 52px; }
}

}

const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function floaty(m,c){if(RM)return;const d=document.createElement('div');d.className='fx';d.textContent=m;if(c)d.style.color=c;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function confetti(n){if(RM)return;const cv=$('#cv'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#ffe066','#2b4bde','#16a56a','#ff6b6b','#7d96ff','#ff9f43'];const P=Array.from({length:n||120},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*6,c:cols[Math.random()*6|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})()}
function gainXP(n){const a=lvl(store.xp);store.xp+=n;const b=lvl(store.xp);if(b>a){toast('⬆️ Level '+b+': '+title(b)+'!');sfx('level');confetti(150);buzz([60,40,60])}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const topics=[...new Set(BANK.map(q=>q.s))];
const cfg={topics:new Set(topics),src:'all',n:25,mode:'practice',shuf:true,qshuf:true};
let S=null;
function pool(){return BANK.filter(q=>cfg.topics.has(q.s)&&(cfg.src==='all'||q.src===cfg.src))}
function playerCard(){const L=lvl(store.xp),lo=cum(L),hi=cum(L+1),pc=(store.xp-lo)/(hi-lo)*100,dp=Math.min(store.today,GOAL)/GOAL*100;
 return `<div class="pc"><div class="r1"><div class="lv">Level ${L}<small>${title(L)}</small></div><div class="fl">🔥 ${store.days} day${store.days===1?'':'s'}</div><span><button class="ic" id="mt" aria-label="${store.mute?'Turn sound effects on':'Turn sound effects off'}">${store.mute?'🔇':'🔊'}</button><button class="ic" id="ms" aria-label="${store.nomusic?'Turn music on':'Turn music off'}">${store.nomusic?'🚫':'🎵'}</button></span></div>
 <div class="mini"><span>${store.xp-lo} / ${hi-lo} XP to Level ${L+1}</span><span>${store.xp} XP total</span></div><div class="bar"><i style="width:${pc}%"></i></div>
 <div class="mini"><span>Daily goal: ${Math.min(store.today,GOAL)} / ${GOAL} questions</span><span>${store.today>=GOAL?'Done ✅':''}</span></div><div class="bar"><i style="width:${dp}%;background:var(--ok)"></i></div>
 <div class="bd">${BADGES.map(([id,ic,n])=>`<div class="b1 ${store.badges.includes(id)?'on':''}"><span>${ic}</span>${n}</div>`).join('')}</div></div>`}
function setup(){
 rollDay();want='lobby';musicStart('lobby');
 const p=pool(),n=cfg.n==='all'?p.length:Math.min(cfg.n,p.length),miss=BANK.filter(q=>store.missed.includes(q.id)).length;
 app.innerHTML=`<h1>Digital Fluency MCQ Quizzer</h1><p class="sub">${BANK.length} questions in your exam style. Build combos, earn XP, keep your streak.</p>${playerCard()}
 <h2>Topics</h2><div class="chips">${topics.map(t=>`<button class="chip" aria-pressed="${cfg.topics.has(t)}" data-t="${esc(t)}">${esc(t)}<small>${BANK.filter(q=>q.s===t).length}</small></button>`).join('')}</div>
 <div class="row"><button class="link" id="all">Select all</button><button class="link" id="none">Clear</button></div>
 <h2>Question set</h2><div class="seg" id="src">${[['all','All'],['exam','From your MCQ file'],['new','New questions']].map(([k,l])=>`<button aria-pressed="${cfg.src===k}" data-v="${k}">${l}</button>`).join('')}</div>
 <h2>Number of questions</h2><div class="seg" id="num">${[10,25,50,100,'all'].map(k=>`<button aria-pressed="${cfg.n===k}" data-v="${k}">${k==='all'?'All':k}</button>`).join('')}</div>
 <h2>Mode</h2><div class="seg" id="mode">${[['practice','Practice (combos + instant answer)'],['exam','Exam (score at end)']].map(([k,l])=>`<button aria-pressed="${cfg.mode===k}" data-v="${k}">${l}</button>`).join('')}</div>
 <div class="row"><span>Shuffle question order</span><label class="sw"><input type="checkbox" id="qs" ${cfg.qshuf?'checked':''}><span></span></label></div>
 <div class="row"><span>Shuffle option order</span><label class="sw"><input type="checkbox" id="os" ${cfg.shuf?'checked':''}><span></span></label></div>
 <div class="sum">${p.length} questions match. This quiz will have ${n}.${store.best!==null?` Best score: ${store.best}%.`:''}</div>
 <button class="btn" id="go" ${p.length?'':'disabled'}>Start quiz</button>
 <button class="btn ghost" id="wk" ${miss?'':'disabled'}>Practise my missed questions (${miss})</button>
 ${miss?'<button class="link" id="clr">Clear missed list</button>':''}`;
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const t=b.dataset.t;cfg.topics.has(t)?cfg.topics.delete(t):cfg.topics.add(t);setup()});
 $('#mt').onclick=()=>{store.mute=!store.mute;save();setup();if(!store.mute)sfx('badge')};$('#ms').onclick=()=>{store.nomusic=!store.nomusic;save();if(store.nomusic)musicStop();setup()};
 $('#all').onclick=()=>{cfg.topics=new Set(topics);setup()};$('#none').onclick=()=>{cfg.topics=new Set();setup()};
 $('#src').onclick=e=>{if(e.target.dataset.v){cfg.src=e.target.dataset.v;setup()}};
 $('#num').onclick=e=>{if(e.target.dataset.v){const v=e.target.dataset.v;cfg.n=v==='all'?'all':+v;setup()}};
 $('#mode').onclick=e=>{if(e.target.dataset.v){cfg.mode=e.target.dataset.v;setup()}};
 $('#qs').onchange=e=>cfg.qshuf=e.target.checked;$('#os').onchange=e=>cfg.shuf=e.target.checked;
 $('#go').onclick=()=>{let l=cfg.qshuf?shuffle(p):p.slice();if(cfg.n!=='all')l=l.slice(0,cfg.n);start(l)};
 $('#wk').onclick=()=>{let l=BANK.filter(q=>store.missed.includes(q.id));start(cfg.qshuf?shuffle(l):l)};
 const c=$('#clr');if(c)c.onclick=()=>{store.missed=[];save();setup()};
}
function start(list){
 const qs=list.map(q=>{let idx=[0,1,2,3];if(cfg.shuf&&!q.f)idx=shuffle(idx);return{id:q.id,s:q.s,q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),pick:null,t0:0}});
 S={qs,i:0,combo:0,maxCombo:0,xp:0,startXP:store.xp,startLvl:lvl(store.xp),busy:false};show();window.scrollTo(0,0);setInten(0);sfx('start');want='game';musicStart('game')
}
const mult=c=>c>=10?4:c>=5?3:c>=3?2:1;
function show(){
 const q=S.qs[S.i],pr=cfg.mode==='practice',locked=pr&&q.pick!==null;if(!q.t0)q.t0=Date.now();
 app.innerHTML=`<div class="top"><span>Question ${S.i+1} of ${S.qs.length}</span>${pr?`<span class="cmb" id="cmb">${S.combo>=2?'🔥 x'+S.combo:''}</span>`:''}<button class="link" id="quit">Quit</button></div>
 <div class="bar"><i style="width:${(S.i)/S.qs.length*100}%"></i></div>
 ${pr?`<div class="xpb"><span>Level ${lvl(store.xp)}</span><span id="sx">+${S.xp} XP${mult(S.combo)>1?' (x'+mult(S.combo)+')':''}</span></div>`:''}
 <div class="tag">${esc(q.s)}</div><p class="q">${esc(q.q)}</p>
 <div role="radiogroup" aria-label="Options">${q.o.map((t,k)=>{let c='';if(locked){if(k===q.a)c='ok';else if(k===q.pick)c='bad'}
  return `<button class="opt ${c}" role="radio" aria-checked="${q.pick===k}" data-k="${k}"><span class="bub">${'ABCD'[k]}</span><span>${esc(t)}</span></button>`}).join('')}</div>
 ${locked?`<div class="fb ${q.pick===q.a?'ok':'bad'}">${q.pick===q.a?'Correct':'Wrong. Answer: '+'ABCD'[q.a]+') '+esc(q.o[q.a])}</div>`:''}
 <button class="btn" id="nx" ${q.pick===null?'disabled':''}>${S.i===S.qs.length-1?'Finish':'Next question'}</button>
 ${S.i>0&&!pr?'<button class="btn ghost" id="pv">Previous</button>':''}`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked||S.busy)return;pick(q,+b.dataset.k)});
 $('#nx').onclick=next;
 const pv=$('#pv');if(pv)pv.onclick=()=>{S.i--;show()};
 $('#quit').onclick=()=>{if(confirm('Quit this quiz? Your progress will be lost.'))setup()};
}
function next(){if(S.i===S.qs.length-1)finish();else{S.i++;show();window.scrollTo(0,0)}}
function pick(q,k){
 q.pick=k;
 if(cfg.mode!=='practice'){sfx('click');show();return}
 const ok=k===q.a,secs=(Date.now()-q.t0)/1000;
 store.answered++;rollDay();store.today++;touchDay();
 if(ok){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);store.bestCombo=Math.max(store.bestCombo,S.maxCombo);
  const m=mult(S.combo),g=10*m+(secs<6?5:0);S.xp+=g;gainXP(g);
  show();const sel=$('.opt.ok');if(sel&&!RM)sel.classList.add('pop');
  floaty('+'+g+(secs<6?' ⚡':''));sfx('ok',S.combo);setInten(S.combo);buzz(15);
  if([3,5,10,20].includes(S.combo)){toast('🔥 '+S.combo+' in a row! x'+mult(S.combo)+' XP');confetti(S.combo>=10?160:70);sfx('combo')}
  checkBadges();save();
  S.busy=true;setTimeout(()=>{S.busy=false;if(S&&S.qs[S.i]===q)next()},950);
 }else{
  if(S.combo>=3)toast('Combo broken. Rebuild it!');S.combo=0;setInten(0);show();const b=$('.opt.bad');if(b&&!RM)b.classList.add('shake');sfx('wrong');duck();buzz([40,30,40]);checkBadges();save();
 }
}
function finish(){
 const un=S.qs.filter(q=>q.pick===null).length;
 if(un&&!confirm(un+' question(s) unanswered. Finish anyway?'))return;
 const ok=S.qs.filter(q=>q.pick===q.a),bad=S.qs.filter(q=>q.pick!==q.a),pct=Math.round(ok.length/S.qs.length*100);
 if(cfg.mode!=='practice'){const g=ok.length*10;S.xp=g;gainXP(g);store.answered+=S.qs.length-un;rollDay();store.today+=S.qs.length-un;touchDay()}
 const bonus=pct===100&&S.qs.length>=10?50:pct>=80&&S.qs.length>=10?20:0;if(bonus){S.xp+=bonus;gainXP(bonus)}
 if(pct===100&&S.qs.length>=10)store.perfects++;
 const ids=new Set(store.missed);ok.forEach(q=>ids.delete(q.id));bad.forEach(q=>ids.add(q.id));store.missed=[...ids];
 const newBest=S.qs.length>=10&&(store.best===null||pct>store.best);if(newBest)store.best=pct;
 checkBadges();save();
 const by={};S.qs.forEach(q=>{by[q.s]=by[q.s]||[0,0];by[q.s][1]++;if(q.pick===q.a)by[q.s][0]++});
 const msg=pct===100?'Flawless. Exam ready.':pct>=80?'Strong run. Keep the streak alive.':pct>=50?'Getting there. Retry the misses to lock them in.':'Good start. The misses below are your fastest wins.';
 const L=lvl(store.xp);
 app.innerHTML=`<h1>${newBest?'New best score!':'Results'}</h1><div class="score" id="sc">0%</div><p class="sub">${ok.length} correct out of ${S.qs.length}. ${msg}</p>
 <div class="pc"><div class="big">+<span id="xc">0</span> XP${bonus?' <span class="sp">(includes +'+bonus+' bonus)</span>':''}</div><div class="sp">Best combo this quiz: ${S.maxCombo} · Level ${L} ${title(L)}</div></div>
 <h2>By topic</h2>${Object.entries(by).map(([t,[a,b]])=>`<div class="tb"><div class="l"><span>${esc(t)}</span><span>${a}/${b}</span></div><div class="bar"><i style="width:${a/b*100}%"></i></div></div>`).join('')}
 <h2>${bad.length?'Review wrong answers ('+bad.length+')':'Perfect score'}</h2>
 ${bad.map(q=>`<div class="rev"><b>${esc(q.q)}</b><div class="n">Your answer: ${q.pick===null?'Not answered':esc(q.o[q.pick])}</div><div class="y">Correct: ${esc(q.o[q.a])}</div></div>`).join('')}
 ${bad.length?'<button class="btn" id="rt">Retry wrong questions (+XP)</button>':''}<button class="btn ${bad.length?'ghost':''}" id="nw">New quiz</button>`;
 const rt=$('#rt');if(rt)rt.onclick=()=>start(bad.map(q=>BANK.find(x=>x.id===q.id)));
 $('#nw').onclick=setup;window.scrollTo(0,0);
 const cnt=(el,to,suf)=>{const t0=performance.now(),d=RM?1:900;(function f(t){const p=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*p)+(suf||'');if(p<1)requestAnimationFrame(f)})(t0)};
 cnt($('#sc'),pct,'%');cnt($('#xc'),S.xp);
 want='results';musicStop();setTimeout(()=>{if(want==='results')musicStart('lobby')},3200);if(pct>=80){confetti(pct===100?220:120);sfx('win')}else sfx('end');buzz(pct>=80?[50,30,50,30,90]:30)
}
setup();
</script></body></html>
